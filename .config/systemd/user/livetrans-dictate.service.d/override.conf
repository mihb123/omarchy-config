# Drop-in, so `./dictate install` rewriting the unit file cannot undo this.
[Service]
# Killing the daemon by hand -- btop, kill, pkill -- delivers a signal, and
# systemd counts a signalled death as a failure. With Restart=on-failure that
# brought it straight back RestartSec=2 later, which looked like autostart.
# Treat a signalled death as success so a deliberate kill sticks; a genuine
# crash still exits non-zero and is still restarted.
SuccessExitStatus=SIGTERM SIGINT SIGQUIT SIGKILL
