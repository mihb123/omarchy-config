# Cấu hình mức độ trong suốt (transparency / opacity) cho cửa sổ
# Phím tắt: SUPER + BACKSPACE
#
# Danh sách các mức opacity luân chuyển (1.0 = đục hoàn toàn, 0.5 = trong suốt 50%)
# Bạn có thể tùy chỉnh danh sách này (thêm/bớt/sửa các số).
# Ví dụ:
#   OPACITY_LEVELS=(1.0 0.85 0.70 0.50)
#   OPACITY_LEVELS=(1.0 0.90 0.80 0.70 0.60 0.50 0.40)
OPACITY_LEVELS=(0.99 0.96 0.93)

# Bật/tắt thông báo OSD khi chuyển mức (true / false)
SHOW_NOTIFICATION=true

# Thời gian hiển thị thông báo OSD (mili-giây)
NOTIFICATION_TIMEOUT_MS=1200

# Ngôn ngữ thông báo ("vi" hoặc "en")
NOTIFICATION_LANG="vi"
